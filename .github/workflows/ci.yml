name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    name: Fixture suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI (version verified locally)
        run: npm install -g @fission-ai/openspec@1.2.0

      - name: Syntax-check all plugin scripts
        run: |
          set -euo pipefail
          find plugins -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run fixture suites
        run: |
          set -euo pipefail
          for suite in tests/run-*.sh; do
            if [[ "$suite" == "tests/run-verification-v2-cross-host.sh" ]]; then
              continue
            fi
            echo "RUN $suite"
            bash "$suite"
          done

  cross-host-drift:
    name: Verification cross-host drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable host lock
        id: host-lock
        run: |
          set -euo pipefail
          lock="tests/verification-v2/cross-host/host-lock.json"
          jq -e '
            .schema == "specnav.verification.cross-host-lock.v1"
            and .source_host == "codex"
            and (.source.commit | test("^[a-f0-9]{40}$"))
            and (.hosts["claude-code"].commit | test("^[a-f0-9]{40}$"))
            and (.hosts["codefree-o"].commit | test("^[a-f0-9]{40}$"))
          ' "$lock" >/dev/null
          echo "claude_ref=$(jq -r '.hosts["claude-code"].commit' "$lock")" >> "$GITHUB_OUTPUT"
          echo "codefree_ref=$(jq -r '.hosts["codefree-o"].commit' "$lock")" >> "$GITHUB_OUTPUT"

      - name: Checkout Claude Code host
        uses: actions/checkout@v4
        with:
          repository: zengwenliang416/specnav-claude-plugin
          ref: ${{ steps.host-lock.outputs.claude_ref }}
          path: hosts/claude

      - name: Checkout CodeFree-O host
        uses: actions/checkout@v4
        with:
          repository: zengwenliang416/specnav-codefree-o-plugin
          ref: ${{ steps.host-lock.outputs.codefree_ref }}
          path: hosts/codefree-o

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect Verification Kernel drift
        env:
          SPECNAV_CLAUDE_ROOT: ${{ github.workspace }}/hosts/claude
          SPECNAV_CODEFREE_O_ROOT: ${{ github.workspace }}/hosts/codefree-o
        run: npm test
